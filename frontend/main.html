<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Klasifikasi Sampah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-content">
            <img src="/Users/adrieljie2708/AOL_AI_NEW/Logo.PNG" alt="" class="logo">
            <div class="header-text">
                <h1>TRASHKUYYY</h1>
                <p>Identifikasi jenis sampahmu dengan TRASHKUYYY AI</p>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="grid">
            <div>
                <div class="card">
                    <h2 class="card-title">Upload Gambar</h2>
                    
                    <div id="uploadArea" class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-area-icon">🖼️</div>
                        <p>Drag & drop gambar di sini</p>
                        <p style="font-size: 14px; color: #9ca3af; margin-bottom: 16px;">atau</p>
                        <button class="btn btn-primary">Pilih Gambar</button>
                    </div>

                    <div id="previewSection" style="display: none;">
                        <div class="preview-container">
                            <img id="previewImage" class="preview-image" alt="Preview">
                        </div>
                        <div class="button-group">
                            <button class="btn btn-primary" onclick="analyzeImage()" id="analyzeBtn">
                                Analisis Gambar
                            </button>
                            <button class="btn btn-secondary" onclick="resetForm()">Reset</button>
                        </div>
                        <div id="errorBox" style="display: none;" class="error-box">
                            <div class="error-box-icon">⚠️</div>
                            <p id="errorText"></p>
                        </div>
                    </div>

                    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
                </div>

                <!-- Info Card -->
                <div class="info-card">
                    <h3> Cara Penggunaan</h3>
                    <ol class="info-list">
                        <li><span class="info-number">1</span>Upload gambar sampah</li>
                        <li><span class="info-number">2</span>Klik "Analisis Gambar"</li>
                        <li><span class="info-number">3</span>Lihat hasil klasifikasi</li>
                    </ol>
                </div>
            </div>

            <!-- Result Section -->
            <div>
                <div class="card">
                    <h2 class="card-title">Hasil Klasifikasi</h2>
                    
                    <div id="resultPlaceholder" class="result-placeholder">
                        <div class="result-placeholder-icon">🖼️</div>
                        <p>Upload gambar dan klik analisis untuk melihat hasil</p>
                    </div>

                    <div id="resultContent" class="result-content" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
